<!DOCTYPE html>
<html>
    <head>
        <title> DSA Visualizer</title>
        <link rel ="stylesheet" href="style.css">
        </head>
        <body>

            <h1>Sorting Visualizer</h1>

           
                <div id ="controls">

                <button id = "generate" onclick ="generateArray()">Generate New Array</button>
                <select id="algorithm" onchange ="updateAlgorithmInfo()">
                    
                    <option value ="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value = "insertion"> Insertion Sort</option>
                    <option value = "merge"> Merge Sort</option>
                    <option value = "quick">Quick Sort</option>
                </select>
                <button id = "sort" onclick ="startSorting()">Start Sorting</button>
                <br><br>
                <input type ="number"id ="searchValue " placeholder ="Enter value">
                <button id ="search" onclick="startSearch()">Search</button>
                <button id ="theme"onclick="toggleTheme()"> 🌙Dark Mode</button>

                

                <input type="range" id ="speed" min = "10" max ="500" value="100">
                </div>
                <label for="speed">Speed:</label>
                <label>Array Size:</label>
                <input 
                type ="range"
                id ="size"
                min ="10"
                max="100"
                value="30"
                oninput="generateArray()">

                <span id ="sizeValue">30</span>

                <h2>Algorithm Information</h2>
                <div id="info">
                    <p><strong>Name:</strong><span id ="algoName"></span></p>
                    <p><strong>Best Case:</strong><span id ="best"></span></p>
                    <p><strong>Average Case:</strong><span id="average"></span></p>
                    <p><strong>Worst Case:</strong><span id ="worst"></span></p>
                    <p><strong>Space:</strong><span id = "space"></span></p>
                    <p id="description"></p>
                    
                <div id="statistics">

    <h2>Statistics</h2>

    <p><strong>Status:</strong> <span id="status">Ready</span></p>

    <p><strong>Total Elements:</strong> <span id="totalElements">30</span></p>

    <p><strong>Comparisons:</strong> <span id="comparisons">0</span></p>

    <p><strong>Swaps:</strong> <span id="swaps">0</span></p>

    <p><strong>Sorting Time:</strong> <span id="time">0 ms</span></p>

    </div>
                
                


                <div id="array-container"></div>

                <script src="script.js"></script>

                </body>
                </html>
                </div>
